<section id="page-contact" class="page-section">
    <div class="container">
        <div class="section-header">
            <span class="sub-heading">Get in Touch</span>
                <h2>Follow Us & Contact</h2>
                <p>Have questions, feedback, or want to say hello? Connect with us across our channels.</p>
        </div>

        <div class="contact-grid">
            <!-- Contact Info & Social Links -->
             <div class="contact-info-card">
                <div>
                    <h3>Direct Contact</h3>
                    <div class="contact-methods">
                        <p>
                            <span class="contact-icon"><i class="fa-solid fa-phone"></i></span>
                            <a href="tel:5558392001">(555) 839-2001</a>
                        </p>
                        <p>
                            <span class="contact-icon"><i class="fa-solid fa-envelope"></i></span>
                            <a href="mailto:hello@brewblossomcafe.com">hello@brewblossomcafe.com</a>
                        </p>
                    </div>
                </div>

                <div>
                    <h3>Social Media Links</h3>
                    <div class="social-links">
                        <a href="https://instagram.com" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                        <a href="https://facebook.com" target="_blank" class="social-icon"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="https://tiktok.com" target="_blank" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
                    </div>
                </div>
        </div>

        <!-- General Contact Form -->
        <div class="form-container">
            <h3>Send Us a Message</h3>
            <form action="https://formspree.io/f/mabndkqr" method="POST">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="name" required placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="jane@example.com">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" rows="4" required placeholder="How can we help you today?"></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>
